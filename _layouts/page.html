---
layout: default
---
<section class="page-hero">
  <div class="wrap">
    {% if page.eyebrow %}<div class="tag">{{ page.eyebrow }}</div>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.intro %}<p class="intro">{{ page.intro }}</p>{% endif %}
  </div>
</section>
<main class="paper">
  <div class="wrap {% if page.wide %}wide{% else %}prose{% endif %}">
    {{ content }}
  </div>
</main>
